<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Próximo Vitrasa</title>
  <meta name="description" content="Paradas de Vitrasa en Vigo y cuándo llega el próximo bus.">
  <meta name="theme-color" content="#13222C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/BarlowCondensed-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Barlow-Medium.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="map" aria-label="Mapa de paradas"></div>

  <button id="locate" class="locate" type="button" aria-label="Mostrar paradas cerca de mí">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7" fill="none"/></svg>
  </button>

  <aside id="panel" class="panel" data-state="peek" aria-label="Paradas">
    <button id="grip" class="grip" type="button" aria-label="Ampliar o reducir panel"><span></span></button>

    <header class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Próximo Vitrasa</h1>
    </header>

    <div class="search">
      <label class="visually-hidden" for="q">Buscar parada</label>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" spellcheck="false"
             placeholder="Nombre o número de parada">
    </div>

    <!-- Lista: resultados de búsqueda, cerca de mí o favoritas -->
    <section id="home" class="view">
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-near" aria-selected="true" type="button">Cerca</button>
        <button role="tab" id="tab-fav" aria-selected="false" type="button">Favoritas</button>
      </div>
      <p id="list-note" class="note"></p>
      <ul id="list" class="stops"></ul>
    </section>

    <!-- Ficha de parada -->
    <section id="stop" class="view" hidden>
      <div class="stop-head">
        <button id="back" class="icon-btn" type="button" aria-label="Volver">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="stop-title">
          <h2 id="stop-name"></h2>
          <p class="stop-meta">Parada <strong id="stop-id"></strong><span id="stop-dist"></span></p>
        </div>
        <button id="fav" class="icon-btn fav" type="button" aria-pressed="false" aria-label="Guardar en favoritas">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/></svg>
        </button>
      </div>

      <div id="arrivals" class="arrivals" aria-live="polite"></div>

      <footer class="stop-foot">
        <span id="updated"></span>
        <button id="refresh" type="button">Actualizar</button>
        <a id="infobus" target="_blank" rel="noopener">Abrir en Infobus</a>
      </footer>
    </section>
  </aside>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
