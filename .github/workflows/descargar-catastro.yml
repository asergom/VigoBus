# Workflow TEMPORAL (rama datos-catastro): pruebas de descarga de direcciones del Catastro para Vigo.
name: Descargar direcciones del Catastro (temporal)
on:
  push:
    branches: [datos-catastro]
    paths: [.github/workflows/descargar-catastro.yml]
permissions:
  contents: write
jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          mkdir -p fuentes/concello
          cd fuentes/concello
          for f in calles-numeracion.geojson calles-numeracion.csv calles.geojson; do
            curl -sSL --fail --retry 3 -m 300 -o "$f" "https://datos.vigo.org/data/transporte/$f" || echo "FALLO $f"
          done
          ls -la
          head -c 1500 calles-numeracion.geojson; echo
          head -5 calles-numeracion.csv
          gzip -9 -k calles-numeracion.geojson calles.geojson
          rm -f calles-numeracion.geojson calles.geojson
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuentes
          git commit -m "Pruebas de descarga del Catastro para Vigo ($(date -u +%Y-%m-%d))" || exit 0
          git push
