# Workflow TEMPORAL (rama datos-catastro): pruebas de descarga de direcciones del Catastro para Vigo.
name: Descargar direcciones del Catastro (temporal)
on:
  push:
    branches: [datos-catastro]
    paths: [.github/workflows/descargar-catastro.yml]
permissions:
  contents: write
jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          mkdir -p fuentes/catastro
          curl -sSL --fail --retry 3 -m 300 -o fuentes/catastro/AD.36039.zip "https://www.catastro.hacienda.gob.es/INSPIRE/Addresses/36/36039-O%20PORRI%D1O/A.ES.SDGC.AD.36039.zip" \
            || curl -sSL --fail --retry 3 -m 300 -o fuentes/catastro/AD.36039.zip "https://www.catastro.hacienda.gob.es/INSPIRE/Addresses/36/36039-O%20PORRI%C3%91O/A.ES.SDGC.AD.36039.zip" || echo FALLO
          file fuentes/catastro/AD.36039.zip; unzip -l fuentes/catastro/AD.36039.zip || true
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuentes
          git commit -m "Pruebas de descarga del Catastro para Vigo ($(date -u +%Y-%m-%d))" || exit 0
          git push
