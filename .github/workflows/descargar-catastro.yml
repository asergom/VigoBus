# Workflow TEMPORAL (rama datos-catastro): pruebas de descarga de direcciones del Catastro para Vigo.
name: Descargar direcciones del Catastro (temporal)
on:
  push:
    branches: [datos-catastro]
    paths: [.github/workflows/descargar-catastro.yml]
permissions:
  contents: write
jobs:
  descargar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar
        run: |
          mkdir -p fuentes/catastro/prueba2
          cd fuentes/catastro/prueba2
          B=https://www.catastro.hacienda.gob.es/INSPIRE
          curl -sSL -m 120 -o atom_BU_36.xml "$B/Buildings/36/ES.SDGC.BU.atom_36.xml" || true
          curl -sSL -m 120 -o atom_CP_36.xml "$B/CadastralParcels/36/ES.SDGC.CP.atom_36.xml" || true
          curl -sSL -m 120 -o atom_AD_36_bis.xml "$B/Addresses/36/ES.SDGC.AD.atom_36.xml?x=2" || true
          # Servicio WFS INSPIRE de direcciones: zona de Avenida das Camelias (Vigo).
          W=http://ovc.catastro.meh.es/INSPIRE/wfsAD.aspx
          curl -sSL -m 120 -o wfs_ad_camelias.xml "$W?service=wfs&version=2&request=getfeature&STOREDQUERIE_ID=GetadByBbox&bbox=42.2245,-8.7285,42.2335,-8.7175&srsname=EPSG::4258" || true
          curl -sSL -m 120 -o wfs_ad_camelias_b.xml "$W?service=wfs&version=2&request=getfeature&STOREDQUERIE_ID=GetadByBbox&bbox=4675000,522000,4676000,523000&srsname=EPSG::25829" || true
          curl -sSL -m 120 -o wfs_bu_camelias.xml "http://ovc.catastro.meh.es/INSPIRE/wfsBU.aspx?service=wfs&version=2&request=getfeature&STOREDQUERIE_ID=GetBuildingByBbox&bbox=42.2290,-8.7240,42.2300,-8.7230&srsname=EPSG::4258" || true
          ls -la
          for f in *.xml; do echo "== $f"; head -c 400 "$f"; echo; done
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuentes
          git commit -m "Pruebas de descarga del Catastro para Vigo ($(date -u +%Y-%m-%d))" || exit 0
          git push
