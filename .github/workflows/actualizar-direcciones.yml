# Actualización mensual de direcciones y red peatonal.
# Descarga la numeración del callejero del Concello de Vigo, las direcciones del Catastro de Redondela,
# Mos y O Porriño y las calles y portales de OpenStreetMap; regenera data/peatonal.json,
# data/direcciones.json y los transbordos a pie de data/viajes.json y, si algo cambia, lo sube a main.
# Si alguna descarga falla o los datos parecen incompletos, no se cambia nada.
name: Actualizar direcciones y red peatonal
on:
  schedule:
    - cron: "37 3 2 * *"      # el día 2 de cada mes a las 03:37 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: actualizar-datos
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Descargar numeración del Concello y direcciones del Catastro
        run: |
          mkdir -p /tmp/fuentes
          curl -sSL --fail --retry 3 -m 300 -o /tmp/fuentes/numeracion.csv https://datos.vigo.org/data/transporte/calles-numeracion.csv
          C=https://www.catastro.hacienda.gob.es/INSPIRE/Addresses/36
          curl -sSL --fail --retry 3 -m 300 -o /tmp/fuentes/AD.36045.zip "$C/36045-REDONDELA/A.ES.SDGC.AD.36045.zip"
          curl -sSL --fail --retry 3 -m 300 -o /tmp/fuentes/AD.36033.zip "$C/36033-MOS/A.ES.SDGC.AD.36033.zip"
          curl -sSL --fail --retry 3 -m 300 -o /tmp/fuentes/AD.36039.zip "$C/36039-O%20PORRI%D1O/A.ES.SDGC.AD.36039.zip"
          for f in /tmp/fuentes/*.zip; do unzip -tq "$f"; done

      - name: Descargar calles y portales de OpenStreetMap (Overpass)
        run: |
          BBOX='42.135,-8.835,42.290,-8.610'
          descargar () {   # $1 consulta, $2 fichero
            for U in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
              echo "Probando $U"
              if curl -sS -f --max-time 600 -A "proximovitrasa (github.com/asergom/proximovitrasa)" --data-urlencode "data=$1" "$U" -o "$2" \
                 && python3 -c "import json,sys; d=json.load(open('$2')); assert d['elements']; print(len(d['elements']), 'elementos')"; then
                return 0
              fi
              sleep 30
            done
            return 1
          }
          descargar "[out:json][timeout:300];(way[\"highway\"]($BBOX););(._;>;);out body;" /tmp/fuentes/vias.json
          descargar "[out:json][timeout:300];(nwr[\"addr:housenumber\"]($BBOX););out center tags;" /tmp/fuentes/portales_osm.json
          # Sitios importantes con nombre, para el buscador (tools/actualizar_sitios.py).
          SITIOS="[out:json][timeout:300];(nwr[name][amenity~'^(hospital|clinic|doctors|police|townhall|courthouse|university|college|school|library|theatre|cinema|arts_centre|marketplace|bus_station|ferry_terminal|fire_station|post_office|community_centre|conference_centre|exhibition_centre)\$']($BBOX);nwr[name][shop~'^(mall|department_store)\$']($BBOX);nwr[name][railway=station]($BBOX);nwr[name][aeroway~'^(aerodrome|terminal)\$']($BBOX);nwr[name][leisure~'^(stadium|sports_centre|park|marina|water_park)\$']($BBOX);nwr[name][natural=beach]($BBOX);nwr[name][tourism~'^(museum|attraction|viewpoint|hotel|gallery|zoo)\$']($BBOX);nwr[name][office=government]($BBOX););out center tags;"
          descargar "$SITIOS" /tmp/fuentes/sitios.json

      - name: Comprobar que los datos están completos
        run: |
          python3 - <<'EOF'
          import csv, gzip, json, sys, zipfile
          def filas(p, abrir=open):
              with abrir(p, "rt", encoding="utf-8") as f:
                  return sum(1 for r in csv.DictReader(f) if r["num"].strip())
          nuevo, antes = filas("/tmp/fuentes/numeracion.csv"), filas("data/concello/numeracion.csv.gz", gzip.open)
          print(f"Concello: {nuevo} portales con número (antes {antes})")
          if nuevo < 0.9 * antes: sys.exit("La numeración del Concello parece incompleta")
          for nombre, nuevo_p, antes_p in (("vías", "/tmp/fuentes/vias.json", "data/osm/vias.json.gz"),
                                           ("portales OSM", "/tmp/fuentes/portales_osm.json", "data/osm/direcciones.json.gz"),
                                           ("sitios", "/tmp/fuentes/sitios.json", "data/osm/sitios.json.gz")):
              n = len(json.load(open(nuevo_p))["elements"]); a = len(json.load(gzip.open(antes_p, "rt"))["elements"])
              print(f"OSM {nombre}: {n} elementos (antes {a})")
              if n < 0.9 * a: sys.exit(f"OSM ({nombre}) parece incompleto")
          EOF

      - name: Regenerar red peatonal, direcciones y transbordos
        run: |
          antes=$(python3 -c "import csv,gzip; print(sum(1 for _ in csv.DictReader(gzip.open('data/catastro/portales.csv.gz','rt'))))")
          gzip -9 -n -c /tmp/fuentes/numeracion.csv > data/concello/numeracion.csv.gz
          gzip -9 -n -c /tmp/fuentes/vias.json > data/osm/vias.json.gz
          gzip -9 -n -c /tmp/fuentes/portales_osm.json > data/osm/direcciones.json.gz
          gzip -9 -n -c /tmp/fuentes/sitios.json > data/osm/sitios.json.gz
          python3 tools/catastro_portales.py /tmp/fuentes/AD.36045.zip /tmp/fuentes/AD.36033.zip /tmp/fuentes/AD.36039.zip
          python3 -c "
          import csv,gzip,sys
          n=sum(1 for _ in csv.DictReader(gzip.open('data/catastro/portales.csv.gz','rt')))
          print('Catastro:', n, 'portales (antes $antes)')
          sys.exit('El Catastro parece incompleto' if n < 0.9*$antes else 0)"
          python3 tools/actualizar_peatonal.py
          python3 tools/actualizar_direcciones.py
          node tools/transbordos.js
          python3 tools/actualizar_sitios.py
          python3 -c "import json,sys; n=len(json.load(open('data/sitios.json'))['sitios']); print(n,'sitios'); sys.exit('Pocos sitios' if n<300 else 0)"
          # Comprobación rápida: la red peatonal, las direcciones y el planificador cargan y responden.
          node -e "
          const fs=require('fs');
          const net=require('./js/peaton.js').build(JSON.parse(fs.readFileSync('data/peatonal.json')));
          const r=net.route([42.2386,-8.7206],[42.2320,-8.7140]); if(!r||r.dist<300||r.dist>2500) throw new Error('ruta a pie rara');
          const d=require('./js/direcciones.js').build(JSON.parse(fs.readFileSync('data/direcciones.json')));
          const s=d.matchStreets('camelias')[0]; if(!s||s.portals.length<100) throw new Error('faltan portales');
          const p=require('./js/planificador.js').build(require('./data/viajes.json')); if(p.pats.length<100) throw new Error('planificador');
          console.log('OK: ruta', Math.round(r.dist), 'm;', d.streets.length, 'calles;', p.pats.length, 'recorridos');"
          node tools/probar_planificador.js 150

      - name: Subir si hay cambios
        run: |
          if git diff --quiet -- data; then echo "Sin cambios"; exit 0; fi
          git diff --stat -- data
          # Nueva versión del service worker para que la app instalada descargue los datos nuevos.
          python3 - <<'EOF'
          import re
          s = open("sw.js", encoding="utf-8").read()
          s = re.sub(r'VERSION = "pv-v(\d+)"', lambda m: f'VERSION = "pv-v{int(m.group(1)) + 1}"', s, count=1)
          open("sw.js", "w", encoding="utf-8").write(s)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data sw.js
          git commit -m "Direcciones y red peatonal actualizadas ($(date -u +%Y-%m-%d))"
          git push origin HEAD:${GITHUB_REF_NAME}
